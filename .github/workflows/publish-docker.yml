name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'  # For pre-releases like v1.2.3-beta
    paths-ignore:
      - 'documentation/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

# Every main push/tag must publish its own image, so never cancel in-flight runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/goose

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { name: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write     # push image + registry build cache to ghcr
      id-token: write     # Sigstore OIDC signing
      attestations: write # SLSA build provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push Docker image
        id: docker-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.name }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.name }},mode=min

      - name: Attest Docker image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true

      - name: Export image digest
        env:
          DIGEST: ${{ steps.docker-push.outputs.digest }}
        run: echo "$DIGEST" > "digest-${{ matrix.name }}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digest-${{ matrix.name }}
          path: digest-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write     # push multi-arch manifest to ghcr
      id-token: write     # Sigstore OIDC signing
      attestations: write # SLSA build provenance
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # For main branch: latest, main, and sha
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            # For tags: v1.2.3 -> 1.2.3, 1.2, 1, latest (if not pre-release)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # For pre-release tags: keep the full version
            type=raw,value={{tag}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        id: merge
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          AMD64=$(cat digests/digest-amd64)
          ARM64=$(cat digests/digest-arm64)
          ARGS=()
          while IFS= read -r TAG; do
            [ -n "$TAG" ] && ARGS+=(-t "$TAG")
          done <<< "$TAGS"
          [ "${#ARGS[@]}" -gt 0 ]
          docker buildx imagetools create "${ARGS[@]}" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          MERGED="sha256:$(docker buildx imagetools inspect "${ARGS[1]}" --raw | sha256sum | cut -d' ' -f1)"
          echo "merged_digest=$MERGED" >> "$GITHUB_OUTPUT"
          echo "Pushed multi-arch manifest $IMAGE@$MERGED with tags:"
          echo "$TAGS"

      - name: Attest multi-arch manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.merge.outputs.merged_digest }}
          push-to-registry: true
